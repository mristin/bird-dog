<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The Bird Dog emblem: a winged dog in the bird-dog pose on a swallow-tailed pennant. See DESIGN.md. -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6f9e"/>
      <stop offset="1" stop-color="#174a6e"/>
    </linearGradient>
    <clipPath id="tile"><rect width="128" height="128" rx="22"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="22" fill="url(#sea)"/>
  <path d="M0 108 Q16 102 32 108 T64 108 T96 108 T128 108 V128 H0 Z" fill="#123a57" opacity="0.6" clip-path="url(#tile)"/>

  <!-- The pole -->
  <rect x="10" y="10" width="6" height="108" rx="3" fill="#7a4a22"/>
  <circle cx="13" cy="10" r="5" fill="#d9a441"/>

  <!-- The pennant -->
  <path d="M16 18 H124 L111 56 L124 94 H16 Z" fill="#f4e7c5" stroke="#9e1b1b" stroke-width="4" stroke-linejoin="round"/>

  <g fill="#9e1b1b" stroke="#9e1b1b" stroke-linecap="round" stroke-linejoin="round">
    <!-- The stretched front leg, reaching forward (toward the pole) -->
    <path d="M50 58 L28 58" stroke-width="6" fill="none"/>
    <ellipse cx="26" cy="58" rx="4" ry="3.2" stroke="none"/>

    <!-- The stretched hind leg, reaching back -->
    <path d="M80 55 L101 53" stroke-width="7" fill="none"/>
    <ellipse cx="102" cy="53" rx="3.6" ry="3" stroke="none"/>

    <!-- The standing legs -->
    <path d="M54 60 L53 79" stroke-width="6.5" fill="none"/>
    <path d="M76 60 L78 79" stroke-width="7.5" fill="none"/>
    <ellipse cx="51" cy="80" rx="5" ry="2.6" stroke="none"/>
    <ellipse cx="77" cy="80" rx="5" ry="2.6" stroke="none"/>

    <!-- The body, flat like a table -->
    <path d="M44 52 Q46 46 56 46 H76 Q86 46 86 54 Q86 63 76 63 H56 Q44 64 44 56 Z" stroke="none"/>

    <!-- The tail -->
    <path d="M85 51 Q93 48 95 40" stroke-width="3.5" fill="none"/>

    <!-- The head, looking a little down -->
    <path d="M52 52 Q47 35 37 33 Q29 32 27 37 L20 40 Q18 44 23 45 L31 46 Q38 47 45 56 Z" stroke="none"/>
    <!-- The ear -->
    <path d="M38 33 Q45 35 44 44 Q40 41 38 33 Z" fill="#6e1010" stroke="none"/>
    <!-- The nose -->
    <circle cx="20" cy="41.5" r="1.8" fill="#3b0808" stroke="none"/>
  </g>
  <!-- The eye -->
  <circle cx="32" cy="37.5" r="1.4" fill="#f4e7c5"/>

  <!-- The seagull wing on the back -->
  <path d="M56 47 Q58 28 74 21 Q86 17 98 20 Q90 23 89 26 Q93 27 95 29 Q85 30 83 33 Q86 35 87 37 Q78 37 75 40 Q73 44 70 46 Z"
        fill="#9e1b1b" stroke="#f4e7c5" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M62 44 Q70 32 86 27 M66 45 Q74 37 84 34" fill="none" stroke="#f4e7c5" stroke-width="1.2" stroke-linecap="round"/>
</svg>
